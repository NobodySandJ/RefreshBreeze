<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refresh Breeze - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="foto/logo.jpg" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc; /* Latar belakang abu-abu sangat terang (lebih netral) */
            color: #1e293b; /* Teks abu-abu tua */
        }
        .login-section-bg {
             background-color: #f1f5f9; /* Latar belakang login sedikit lebih gelap */
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }
        .summary-card {
            background-color: #dcfce7; /* Kartu ringkasan pendapatan (sesuai referensi) */
            border: 1px solid #86efac;
        }
        /* Styling untuk kartu per member agar lebih rapi */
        #member-summary > div {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 0.5rem;
            text-align: center;
            transition: all 0.2s ease-in-out;
        }
        #member-summary > div:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        th {
            background-color: #166534; /* Header tabel (sesuai referensi) */
            color: #ffffff;
        }
        th, td {
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 16px;
            text-align: left;
        }
        tr:nth-child(even) {
            background-color: #fdfdff; /* Baris tabel genap (hampir putih) */
        }
        tr:hover {
            background-color: #f0fdf4; /* Hover baris tabel (sesuai referensi) */
        }
    </style>
</head>
<body>

    <div id="login-section" class="min-h-screen flex items-center justify-center p-4 login-section-bg">
        <div class="card w-full max-w-md p-8 rounded-xl">
            <img src="foto/logo.png" alt="Logo" class="w-24 h-24 mx-auto mb-4"/>
            <h1 class="text-3xl font-bold text-center text-green-700 mb-2">Refresh Breeze Admin</h1>
            <p class="text-center text-gray-500 mb-6">Silakan login untuk melanjutkan</p>
            <form id="login-form">
                <div class="mb-4">
                    <label for="username" class="block mb-2 text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition" required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block mb-2 text-sm font-medium text-gray-700">Password</label>
                    <div class="relative">
                        <input type="password" id="password" class="w-full pl-4 pr-10 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition" required>
                        <button type="button" id="toggle-password" class="absolute top-1/2 right-3 -translate-y-1/2 text-gray-400 hover:text-green-600">
                            <i id="toggle-icon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-lg hover:bg-green-700 transition">Login</button>
                <p id="login-error" class="text-red-500 text-center text-sm mt-4"></p>
            </form>
        </div>
    </div>

    <div id="admin-dashboard" class="hidden p-4 md:p-8">
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-gray-200">
             <h1 class="text-3xl font-bold text-green-800">Admin Dashboard</h1>
             <button id="logout-button" class="px-4 py-2 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700 transition">Logout</button>
        </header>

        <div class="mb-8 card p-6 rounded-lg">
            <h2 class="text-2xl font-bold text-green-700 mb-4">Ringkasan Penjualan</h2>
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <div class="summary-card p-6 rounded-lg text-center">
                    <h3 class="text-gray-600 font-semibold">Total Pendapatan</h3>
                    <p id="total-revenue" class="text-3xl font-bold text-green-800 mt-1">Rp0</p>
                </div>
                <div class="lg:col-span-3">
                     <h3 class="text-gray-600 font-semibold mb-3">Penjualan Cheki per Member</h3>
                     <div id="member-summary" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-4">
                        </div>
                </div>
            </div>
        </div>

        <div class="card rounded-xl overflow-hidden">
            <div class="p-6 flex justify-between items-center bg-gray-50 border-b border-gray-200">
                <h2 class="text-2xl font-bold text-green-700">Daftar Pesanan</h2>
                <div class="flex items-center gap-4">
                    <a id="google-sheet-link" href="#" target="_blank" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition">
                        Buka Google Sheet
                    </a>
                    <button id="refresh-button" class="px-4 py-2 bg-gray-600 text-white font-semibold rounded-lg hover:bg-gray-500 transition">
                        <i class="fas fa-sync-alt mr-2"></i>Refresh Data
                    </button>
                </div>
            </div>
            <div id="loader" class="text-center py-16">
                <p class="text-lg">Memuat data, mohon tunggu...</p>
            </div>
            <div class="overflow-x-auto">
                <table id="orders-table" class="w-full min-w-[1000px] hidden">
                    <thead>
                        <tr>
                            <th>Waktu Pesan</th>
                            <th>Nama</th>
                            <th>Email</th>
                            <th>WhatsApp</th>
                            <th>Detail Pesanan</th>
                            <th>Total</th>
                            <th>Bukti Bayar</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
